spring.application.name=notification-service
server.port=8089

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# MySQL (shared auth_db)
spring.datasource.url=jdbc:mysql://localhost:3307/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=fusion5user
spring.datasource.password=Fusion5@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=fusion5
spring.rabbitmq.password=Fusion5@2026

# Queue — bound with a wildcard pattern so ANY service can publish
# routing keys like notification.team.invite, notification.kyc.approved, etc.
notification.rabbitmq.queue=notification.events.queue
notification.rabbitmq.exchange=skillasaservice.exchange
notification.rabbitmq.routing-key-pattern=notification.#

# JWT (must match every other service)
jwt.secret=Fusion5SkillAsAServiceSuperSecretKeyForJWT2026MustBe256BitsLong

# ── Email (SMTP) ─────────────────────────────────────────────────────────
# Fill these in with real credentials to enable actual sending.
# For Gmail SMTP (testing only): host=smtp.gmail.com, port=587, use an App Password.
# For Amazon SES SMTP: use your SES SMTP endpoint/credentials for your region.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME@example.com
spring.mail.password=CHANGE_ME_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.email.from=no-reply@skillasaservice.com

# ── Push notifications (Firebase Cloud Messaging) ──────────────────────────
# No real credentials configured — push notifications will initialize as DISABLED
# and every send is a logged no-op (see PushNotificationService). To enable:
# 1. In Firebase console: Project Settings → Service Accounts → Generate new private key
# 2. Save that JSON file somewhere on this server, e.g. /etc/skillasaservice/firebase.json
# 3. Point this property at it:
firebase.credentials.path=classpath:firebase-service-account.json
