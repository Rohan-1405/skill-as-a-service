spring.application.name=storage-service
server.port=8091

spring.datasource.url=jdbc:mysql://localhost:3307/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=fusion5user
spring.datasource.password=Fusion5@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=Fusion5SkillAsAServiceSuperSecretKeyForJWT2026MustBe256BitsLong

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Storage provider selection ──────────────────────────────────────────
# "local" (default) needs nothing else below - works right now with zero credentials.
# Switch to "s3" once you have real AWS S3 or Wasabi credentials, then fill in storage.s3.*
storage.provider=local

# LOCAL provider settings
storage.local.base-path=./storage-uploads
# Must match wherever the API Gateway / client actually reaches this service.
storage.local.public-base-url=http://localhost:8091

# S3 provider settings (ignored while storage.provider=local)
# storage.s3.bucket-name=your-bucket-name
# storage.s3.region=us-east-1
# storage.s3.access-key=CHANGE_ME
# storage.s3.secret-key=CHANGE_ME
# For Wasabi (or any other S3-compatible provider), set this - leave blank/commented for real AWS S3:
# storage.s3.endpoint-override=https://s3.wasabisys.com
# storage.s3.presign-expiry-minutes=15
